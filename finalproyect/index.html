<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Final Ormeño - TechStore</title>
  <link rel="stylesheet" href="./css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="header">
    <div class="header-contenedor">
      <div>
        <h1>ormenot0 company</h1>
        <p>Mi eccomerce propio</p>
      </div>

      <div class="carrito-header">
        <span>🛒 Carrito:</span>
        <span id="contador-carrito">0</span>
      </div>
    </div>
  </header>

  <main class="main">

    <section class="panel-controles">
      <h2>Explorar productos</h2>

      <div class="controles">
        <input 
          type="text" 
          id="buscador" 
          placeholder="Buscar producto por nombre"
        >

        <select id="filtro-categoria">
          <option value="todos">Todas las categorías</option>
          <option value="audio">Audio</option>
          <option value="perifericos">Periféricos</option>
          <option value="monitores">Monitores</option>
          <option value="accesorios">Accesorios</option>
        </select>

        <select id="orden-precio">
          <option value="default">Ordenar por</option>
          <option value="menor-mayor">Precio: menor a mayor</option>
          <option value="mayor-menor">Precio: mayor a menor</option>
        </select>

        <button id="btn-reset-filtros">Resetear filtros</button>
      </div>
    </section>

    <section class="seccion-productos">
      <h2>Catálogo de productos</h2>
      <div id="contenedor-productos" class="grid-productos">

      </div>
    </section>

    <section class="seccion-carrito">
      <h2>Carrito de compras</h2>

      <div id="contenedor-carrito" class="contenedor-carrito">
        <p class="carrito-vacio">Tu carrito está vacío.</p>
      </div>

      <div class="resumen-carrito">
        <p><strong>Subtotal:</strong> $<span id="subtotal">0</span></p>
        <p><strong>Envío:</strong> $<span id="envio">0</span></p>
        <p><strong>Total final:</strong> $<span id="total">0</span></p>
      </div>

      <div class="acciones-carrito">
        <button id="btn-vaciar-carrito">Vaciar carrito</button>
      </div>
    </section>

    <section class="seccion-checkout">
      <h2>Finalizar compra</h2>

      <form id="form-checkout" class="form-checkout">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            value="Agustin Nicolas Ormeno"
            required
          >
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            value="ormenot0@gmail".com"
            required
          >
        </div>

        <div class="campo">
          <label for="direccion">Dirección</label>
          <input 
            type="text" 
            id="direccion" 
            name="direccion" 
            value="Av. Rivadavia 1234"
            required
          >
        </div>

        <div class="campo">
          <label for="pago">Método de pago</label>
          <select id="pago" name="pago" required>
            <option value="tarjeta">Tarjeta de crédito</option>
            <option value="debito">Tarjeta de débito</option>
            <option value="transferencia">Transferencia bancaria</option>
            <option value="efectivo">Efectivo</option>
          </select>
        </div>

        <div class="campo">
          <label for="tipo-envio">Tipo de envío</label>
          <select id="tipo-envio" name="tipo-envio" required>
            <option value="retiro">Retiro en sucursal</option>
            <option value="domicilio">Envío a domicilio</option>
          </select>
        </div>

        <button type="submit" id="btn-finalizar-compra">Finalizar compra</button>
      </form>
    </section>

  </main>

  <footer class="footer">
    <p>Derechos reservados - Agustin Ormeno</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
